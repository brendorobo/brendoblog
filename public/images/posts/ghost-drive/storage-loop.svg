<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Medium Not Present loop"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9fa5"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb3d4"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8b26e"/></marker></defs><rect width="1000" height="600" rx="14" fill="#161719"/><text x="500.0" y="46" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#dcdddf" text-anchor="middle">What the "drive" says every time Windows checks on it</text><text x="500.0" y="76" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9b9fa5" text-anchor="middle">Captured with Wireshark + USBPcap. This loop repeats about once per second.</text><rect x="90" y="100" width="220" height="56" rx="10" fill="#1b222a" stroke="#8fb3d4" stroke-width="2"/><text x="200" y="135" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#dcdddf" text-anchor="middle">Windows (host)</text><rect x="690" y="100" width="220" height="56" rx="10" fill="#26211a" stroke="#d8b26e" stroke-width="2"/><text x="800" y="135" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#dcdddf" text-anchor="middle">Speaker's storage</text><path d="M200 156 V470 M800 156 V470" stroke="#383b40" stroke-width="2" stroke-dasharray="4 6"/><path d="M204 195 H794" stroke="#8fb3d4" stroke-width="2" marker-end="url(#ahA)"/><text x="500.0" y="185" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#8fb3d4" text-anchor="middle">TEST UNIT READY</text><text x="500.0" y="217" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9b9fa5" text-anchor="middle">"Is there anything in the drive?"</text><path d="M796 265 H206" stroke="#d8b26e" stroke-width="2" marker-end="url(#ahR)"/><text x="500.0" y="255" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#d8b26e" text-anchor="middle">CHECK CONDITION</text><text x="500.0" y="287" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9b9fa5" text-anchor="middle">"Not ready."</text><path d="M204 335 H794" stroke="#8fb3d4" stroke-width="2" marker-end="url(#ahA)"/><text x="500.0" y="325" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#8fb3d4" text-anchor="middle">REQUEST SENSE</text><text x="500.0" y="357" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9b9fa5" text-anchor="middle">"Why not?"</text><path d="M796 405 H206" stroke="#d8b26e" stroke-width="2" marker-end="url(#ahR)"/><text x="500.0" y="395" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#d8b26e" text-anchor="middle">Sense 3A/00: MEDIUM NOT PRESENT</text><text x="500.0" y="427" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9b9fa5" text-anchor="middle">"There's nothing in here."</text><path d="M170 405 C 120 405, 120 195, 170 195" stroke="#6a6e74" stroke-width="1.5" fill="none" marker-end="url(#ah)"/><text x="108" y="300" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6a6e74" text-anchor="end">repeat</text><text x="108" y="318" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6a6e74" text-anchor="end">~1/sec</text><rect x="170" y="490" width="660" height="80" rx="10" fill="#271b1c" stroke="#e07c7c" stroke-width="1.5" stroke-dasharray="6 5"/><text x="500.0" y="522" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="16" font-weight="600" fill="#e07c7c" text-anchor="middle">READ (0x28)  ·  WRITE (0x2A)  ·  READ CAPACITY (0x25)</text><text x="500.0" y="550" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#dcdddf" text-anchor="middle">never sent, even while we dragged a file onto the drive</text></svg>