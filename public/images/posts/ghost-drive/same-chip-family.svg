<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="One chip family, two products"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b9fa5"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fb3d4"/></marker><marker id="ahR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d8b26e"/></marker></defs><rect width="1000" height="640" rx="14" fill="#161719"/><text x="500.0" y="46" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#dcdddf" text-anchor="middle">One chip family, two very different products</text><text x="500.0" y="76" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#9b9fa5" text-anchor="middle">The firmware declares the same three functions no matter what hardware is actually on the board</text><rect x="300" y="100" width="400" height="78" rx="10" fill="#1b222a" stroke="#8fb3d4" stroke-width="2"/><text x="500" y="133" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#dcdddf" text-anchor="middle">Jieli audio chip + generic firmware</text><text x="500" y="160" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#8fb3d4" text-anchor="middle">declares: audio · media keys · storage</text><path d="M500 178 V205 M260 205 H740 M260 205 V228 M740 205 V228" stroke="#9b9fa5" stroke-width="1.5" fill="none"/><path d="M260 214 V228" stroke="#9b9fa5" stroke-width="1.5" marker-end="url(#ah)"/><path d="M740 214 V228" stroke="#9b9fa5" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="232" width="400" height="300" rx="10" fill="#1b1c1f" stroke="#383b40" stroke-width="1.5"/><text x="260" y="266" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#dcdddf" text-anchor="middle">MP3 player / speaker with card slot</text><rect x="80" y="290" width="360" height="60" rx="10" fill="#1a2420" stroke="#a7c6b6" stroke-width="1.5"/><circle cx="110" cy="320" r="13" fill="none" stroke="#a7c6b6" stroke-width="2"/><path d="M103 320 l5 6 l10 -12" stroke="#a7c6b6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="316" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dcdddf" text-anchor="start">Audio</text><text x="138" y="337" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a7c6b6" text-anchor="start">speaker wired up</text><rect x="80" y="366" width="360" height="60" rx="10" fill="#1a2420" stroke="#a7c6b6" stroke-width="1.5"/><circle cx="110" cy="396" r="13" fill="none" stroke="#a7c6b6" stroke-width="2"/><path d="M103 396 l5 6 l10 -12" stroke="#a7c6b6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dcdddf" text-anchor="start">Media keys</text><text x="138" y="413" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a7c6b6" text-anchor="start">physical buttons</text><rect x="80" y="442" width="360" height="60" rx="10" fill="#1a2420" stroke="#a7c6b6" stroke-width="1.5"/><circle cx="110" cy="472" r="13" fill="none" stroke="#a7c6b6" stroke-width="2"/><path d="M103 472 l5 6 l10 -12" stroke="#a7c6b6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="138" y="468" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dcdddf" text-anchor="start">Storage</text><text x="138" y="489" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a7c6b6" text-anchor="start">microSD slot on board</text><rect x="540" y="232" width="400" height="300" rx="10" fill="#1b1c1f" stroke="#383b40" stroke-width="1.5"/><text x="740" y="266" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#dcdddf" text-anchor="middle">This soundbar</text><rect x="560" y="290" width="360" height="60" rx="10" fill="#1a2420" stroke="#a7c6b6" stroke-width="1.5"/><circle cx="590" cy="320" r="13" fill="none" stroke="#a7c6b6" stroke-width="2"/><path d="M583 320 l5 6 l10 -12" stroke="#a7c6b6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="618" y="316" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dcdddf" text-anchor="start">Audio</text><text x="618" y="337" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a7c6b6" text-anchor="start">speaker wired up</text><rect x="560" y="366" width="360" height="60" rx="10" fill="#26211a" stroke="#d8b26e" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="590" cy="396" r="13" fill="none" stroke="#d8b26e" stroke-width="2"/><path d="M584 390 l12 12 M596 390 l-12 12" stroke="#d8b26e" stroke-width="2.5" stroke-linecap="round"/><text x="618" y="392" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dcdddf" text-anchor="start">Media keys</text><text x="618" y="413" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#d8b26e" text-anchor="start">declared, but no buttons</text><rect x="560" y="442" width="360" height="60" rx="10" fill="#26211a" stroke="#d8b26e" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="590" cy="472" r="13" fill="none" stroke="#d8b26e" stroke-width="2"/><path d="M584 466 l12 12 M596 466 l-12 12" stroke="#d8b26e" stroke-width="2.5" stroke-linecap="round"/><text x="618" y="468" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dcdddf" text-anchor="start">Storage</text><text x="618" y="489" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#d8b26e" text-anchor="start">declared, but no slot</text><rect x="60" y="552" width="880" height="62" rx="10" fill="#26211a" stroke="#d8b26e" stroke-width="1.5"/><text x="500.0" y="579" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#dcdddf" text-anchor="middle">Windows trusts what the firmware declares, so the soundbar shows up with</text><text x="500.0" y="601" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#d8b26e" text-anchor="middle">an empty, 0-byte "phantom drive" that has nothing behind it.</text></svg>